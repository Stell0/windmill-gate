name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test policy
        run: go run ./cmd/gate policy test

      - name: Test
        run: go test ./...

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem -LiteralPath . -Filter *.ps1 -Recurse) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          }

      - name: Test installer with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-distribution.ps1

      - name: Test installer with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-distribution.ps1

  distribution-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test distribution scripts
        run: make distribution-test
