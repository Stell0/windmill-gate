ask:
  - command: "grep foo /var/log/messages"
    expect: ASK
  - command: "journalctl -u redis --follow"
    expect: ASK
  - command: "journalctl -u redis -n 100 --output=json"
    expect: ASK
  - command: "uptime && echo ok"
    expect: ASK
  - command: "podman ps | grep redis"
    expect: ASK
  - command: "cat /etc/shadow"
    expect: ASK
  - command: "gate forward add --remote-port 8443"
    expect: ASK
  - command: "gate host add foo.example.com --remote-port 443"
    expect: ASK
  - command: "journalctl -u redis -n 0"
    expect: ASK
  - command: "journalctl -u redis -n 1001"
    expect: ASK
  - command: "podman logs --tail 1001 traefik"
    expect: ASK
  - command: "systemctl status api-server --no-pager --full"
    expect: ASK
  - command: "systemctl list-units --all '*' --no-pager"
    expect: ASK
  - command: "api-cli login"
    expect: ASK
  - command: "api-cli run list-actions | jq ."
    expect: ASK
  - command: "api-cli run module/mail1/get-configuration"
    expect: ASK
  - command: "api-cli run module/mail1/configure-module --data '{}'"
    expect: ASK
  - command: "api-cli run update-module --data '{}'"
    expect: ASK
  - command: "api-cli run set-route --agent module/traefik1 --data '{}'"
    expect: ASK
  - command: "api-cli run get-certificate --agent module/traefik1 --data '{\"fqdn\":\"example.org\"}'"
    expect: ASK
  - command: "runagent -m mail1 systemctl --user restart postfix.service"
    expect: ASK
  - command: "runagent -m mail1 podman inspect postfix"
    expect: ASK
  - command: "runagent -m mail1 podman logs --follow postfix"
    expect: ASK
  - command: "runagent -m mail1 podman logs -f postfix"
    expect: ASK
  - command: "runagent -m mail1 systemctl --user show postfix.service --property=ActiveState --value --no-pager"
    expect: ASK
  - command: "runagent -m mail1 sh -lc 'id'"
    expect: ASK
  - command: "redis-cli HGETALL module/mail1/environment extra"
    expect: ASK
  - command: "redis-cli --raw KEYS 'node/*/vpn'"
    expect: ASK
  - command: "redis-cli PUBLISH module/mail1/event/reload '{}'"
    expect: ASK
  - command: "redis-cli SET module/mail1/ui_name changed"
    expect: ASK
  - command: "podman rmi ghcr.io/nethserver/mail:latest"
    expect: ASK
  - command: "add-module mail 1"
    expect: ASK
  - command: "remove-module mail1"
    expect: ASK
  - command: "runagent -m nethvoice1 podman exec freepbx getent hosts ibm.com"
    expect: ASK
  - command: "runagent -m nethvoice1 podman exec freepbx asterisk -rx 'database del AMPUSER/ cidname'"
    expect: ASK

deny:
  - command: "uptime; reboot"
    expect: DENY
  - command: "rm /tmp/file"
    expect: DENY
  - command: "sudo reboot"
    expect: DENY
  - command: "systemctl restart redis"
    expect: DENY
  - command: "ssh another-host"
    expect: DENY
  - command: "dd if=/dev/zero of=/dev/sda"
    expect: DENY
